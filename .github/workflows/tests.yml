name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install -e ".[lint]"

      - name: Run ruff
        run: ruff check solax/ tests/

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install solax
        run: pip install -e ".[test]"

      - name: Run fast test suite
        run: pytest -m "not slow and not multi_device"

  slow:
    name: pytest (slow, NN training)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install solax
        run: pip install -e ".[test]"

      - name: Run slow test suite
        run: pytest -m slow

  multi_device:
    name: pytest (multi-device, pmap)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install solax
        run: pip install -e ".[test]"

      - name: Run multi-device test suite
        env:
          XLA_FLAGS: "--xla_force_host_platform_device_count=2"
        run: pytest -m multi_device

  build:
    name: build wheel and smoke-test install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel -o dist

      - name: Install wheel into a fresh env and import
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-check/bin/python -c "import solax as sx; print(sx.__version__); sx.RandomKeys; sx.Basis"
