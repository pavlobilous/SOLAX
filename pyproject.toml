[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantumsolax"
dynamic = ["version"]
description = "A Python solver for fermionic quantum systems with neural network support"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Pavlo Bilous", email = "pavlo.bilous@proton.me" },
]
keywords = ["quantum", "fermions", "second quantization", "jax", "neural networks"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: CC0 1.0 Universal (CC0 1.0) Public Domain Dedication",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "jax",
    "flax",
    "optax",
    "orbax-checkpoint",
]

[project.urls]
Homepage = "https://github.com/pavlo-bilous/quantumsolax"
Repository = "https://github.com/pavlo-bilous/quantumsolax"
Paper = "https://www.scipost.org/SciPostPhysCodeb.51"

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]
lint = ["ruff"]
docs = ["sphinx", "furo"]

[tool.setuptools.dynamic]
version = { attr = "solax.__version__" }

[tool.setuptools.packages.find]
include = ["solax*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Scoped to real correctness issues rather than ruff's full opinionated
# default set -- deliberately skips style/idiom categories (import
# sorting, str.split() vs list literals, etc.) that would otherwise
# produce a large, low-value diff across the whole package. Also
# deliberately excludes F403/F405/F821 (wildcard-import name
# detection): solax uses `from .x import *` pervasively as its own
# internal coding style throughout the package, not just for
# __init__.py re-exports, so those checks would be nothing but noise
# here rather than real findings.
select = [
    "E4", "E7", "E9",  # pycodestyle: real errors, not style nags
    "F401", "F402", "F404", "F406", "F407",  # pyflakes: bad imports
    "F5", "F6", "F7",  # pyflakes: string/comparison/statement bugs
    "F811", "F822", "F823", "F841",  # pyflakes: redefinition/undefined/unused
    "B",  # flake8-bugbear: bug-prone patterns (mutable defaults, etc.)
]
ignore = [
    "E731",  # lambda-assignment: pure style, no correctness difference;
             # solax uses named lambdas as private helpers throughout
             # (e.g. get_data/get_bitlen in basis_class.py/state_class.py)
    "B905",  # zip-without-strict: verified a real false positive on
             # this codebase (printing.py's dets_with_coeffs_to_strs
             # deliberately zips a truncated list against a longer
             # array to implement print-limit truncation; strict=True
             # there would turn normal truncated printing into a crash)
]

[tool.ruff.lint.per-file-ignores]
# __init__.py files across the package exist specifically to re-export
# names from their submodules (solax's own module-organization
# convention, e.g. `from .operator_class import Operator`); pyflakes
# has no way to know that "unused" import is the intended public API.
"**/__init__.py" = ["F401"]
# These tests deliberately write a bare "x == y" expression inside
# pytest.raises(AttributeError) to exercise solax classes' intentional
# equality-is-unsupported contract; bugbear can't tell that from an
# accidental no-op comparison.
"tests/*" = ["B015"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: exercises real NN training (flax/optax); not run by default in CI's fast job",
    "multi_device: exercises jax.pmap-based kernels; needs >=2 local JAX devices, e.g. via XLA_FLAGS=--xla_force_host_platform_device_count=2",
]
