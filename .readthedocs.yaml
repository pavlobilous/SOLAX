# Read the Docs configuration. Inert until the repo is connected at
# readthedocs.org (Import a Project -> pick this repo) -- that step has
# to be done by a repo owner via the RTD web UI, not from here.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
